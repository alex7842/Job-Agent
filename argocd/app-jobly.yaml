apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jobly
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_GITHUB_USER/REPLACE_REPO.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: jobly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
