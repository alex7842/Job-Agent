services:
  job-agent-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: jobly-api-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - KAFKA_BROKERS=host.docker.internal:9092
      - TEMPORAL_ADDRESS=host.docker.internal:7333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jobly-net

  job-agent-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: jobly-worker-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - KAFKA_BROKERS=host.docker.internal:9092
      - TEMPORAL_ADDRESS=host.docker.internal:7333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jobly-net
    depends_on:
      - job-agent-api

  rag-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.rag
    container_name: jobly-rag-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - KAFKA_BROKERS=host.docker.internal:9092
      - TEMPORAL_ADDRESS=host.docker.internal:7333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jobly-net

  job-agent-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: jobly-web-local
    restart: unless-stopped
    networks:
      - jobly-net

  nginx:
    image: nginx:alpine
    container_name: jobly-nginx-local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - job-agent-api
      - job-agent-web
      - rag-service
    networks:
      - jobly-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  jobly-net:
    driver: bridge
