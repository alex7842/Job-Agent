services:
  job-agent-api:
    # In Phase 2 the image is pulled from ACR; JOBLY_API_IMAGE is injected by
    # the GitHub Actions deploy step (e.g. myacr.azurecr.io/jobly-api:a3f9b1c).
    # If the variable is not set it falls back to a local build so the file
    # still works during Phase 1 manual deployments.
    image: ${JOBLY_API_IMAGE:-}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: jobly-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jobly-net

  job-agent-worker:
    image: ${JOBLY_WORKER_IMAGE:-}
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: jobly-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jobly-net
    depends_on:
      - job-agent-api

  rag-service:
    image: ${JOBLY_RAG_IMAGE:-}
    build:
      context: .
      dockerfile: docker/Dockerfile.rag
    container_name: jobly-rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jobly-net

  job-agent-web:
    image: ${JOBLY_WEB_IMAGE:-}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: jobly-web
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - jobly-net
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: jobly-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - job-agent-api
      - job-agent-web
      - rag-service
    networks:
      - jobly-net

networks:
  jobly-net:
    driver: bridge
