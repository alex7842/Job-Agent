apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-agent-api
  namespace: jobly
  labels:
    app: job-agent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-agent-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: job-agent-api
    spec:
      containers:
        - name: api
          image: REPLACE_ACR_FQDN/job-agent-api:latest
          imagePullPolicy: Always
          command: ["node", "app/dist/main.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: jobly-config
            - secretRef:
                name: jobly-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
