apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: jobly
  labels:
    app: rag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
        - name: rag
          image: REPLACE_ACR_FQDN/job-agent-rag:latest
          imagePullPolicy: Always
          command: ["node", "app/dist/main.js"]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: jobly-config
            - secretRef:
                name: jobly-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
