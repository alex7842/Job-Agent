apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-agent-worker
  namespace: jobly
  labels:
    app: job-agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-agent-worker
  template:
    metadata:
      labels:
        app: job-agent-worker
    spec:
      containers:
        - name: worker
          image: REPLACE_ACR_FQDN/job-agent-worker:latest
          imagePullPolicy: Always
          command: ["node", "app/dist/temporal/worker.js"]
          envFrom:
            - configMapRef:
                name: jobly-config
            - secretRef:
                name: jobly-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
